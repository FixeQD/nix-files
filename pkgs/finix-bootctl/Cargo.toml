[package]
name = "finix-bootctl"
version = "0.1.0"
edition = "2021"
description = "Manage Finix EFISTUB boot entries via efivar/gpt instead of efibootmgr"
license = "GPL-3.0-only"

[[bin]]
name = "finix-bootctl"
path = "src/main.rs"

[dependencies]
efivar = "2"
gpt = "4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
